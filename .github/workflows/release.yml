# Builds WinLink's downloads on GitHub's machines:
#   Windows  WinLink-Setup.exe                       (x64; Windows on ARM runs it too)
#   Mac      WinLink-mac-AppleSilicon.dmg, WinLink-mac-Intel.dmg
#   Linux    winlink_<version>_amd64.deb / _arm64.deb, winlink-<version>.x86_64.rpm / .aarch64.rpm
#   Android  WinLink-Basic.apk and WinLink-Full.apk (Full adds the phone's accessibility service for
#            your computer's mouse and keyboard), signed with the key from packaging/android/make_signing_key.sh
# Keyboard and mouse sharing needs Deskflow's engine (deskflow-core, GPL-2.0). For Windows and Mac
# it's compiled here from Deskflow's own source and goes inside WinLink, so nobody installs Deskflow.
# Linux uses the distribution's Deskflow: its engine needs libei 1.3+, which only the newest
# distributions have, so one bundled copy couldn't run everywhere.
#
# Run it by pushing a tag (git tag v2026.11.4 && git push origin v2026.11.4): the downloads go to a
# draft release, to check and publish. "Run workflow" on the Actions page builds them without a release.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DESKFLOW_TAG: v1.27.0
  # Qt comes through aqtinstall with Deskflow's own mirror settings (the default server times out)
  AQT_SOURCE: git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e
  PYTHON_VERSION: "3.12"

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        name: WinLink's version (src/net.py)
        run: |
          v=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' src/net.py)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "::error::The tag is ${GITHUB_REF_NAME} but src/net.py says $v"
            exit 1
          fi

  # ---------------------------------------------------------------- Deskflow's engine, from source
  deskflow-mac:
    name: Deskflow engine (Mac ${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: AppleSilicon, arch: arm64, runner: macos-15, qt: 6.11.3, min_macos: "13"}
          - {name: Intel, arch: x86_64, runner: macos-15-intel, qt: 6.9.3, min_macos: "13"}
    steps:
      - uses: actions/checkout@v5
        with: {repository: deskflow/deskflow, ref: "${{ env.DESKFLOW_TAG }}", path: deskflow}
      - run: brew install --quiet openssl ninja
      - uses: jurplel/install-qt-action@v4
        env: {AQT_CONFIG: "${{ github.workspace }}/deskflow/.github/actions/install-dependencies/aqt.ini"}
        with:
          version: "${{ matrix.qt }}"
          cache: true
          cache-key-prefix: "qt-mac-${{ matrix.arch }}"
          aqtsource: ${{ env.AQT_SOURCE }}
      - name: Build
        working-directory: deskflow
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSKIP_BUILD_TESTS=ON \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.min_macos }}
          cmake --build build --config Release -j8
          # Deskflow's packaging step bundles Qt into the app (macdeployqt); hdiutil is flaky on CI
          for i in 1 2 3 4 5; do cmake --build build --config Release --target package && break; sleep 3; done
          ls build/*.dmg
      - name: Take Deskflow.app out of its disk image
        run: |
          # the image shows Deskflow's licence before it opens: agree (WinLink ships it alongside, below)
          { yes || true; } | PAGER=true hdiutil attach -nobrowse -readonly -mountpoint /tmp/df "$(ls deskflow/build/*.dmg | head -1)" > /dev/null
          mkdir -p out
          ditto /tmp/df/Deskflow.app out/Deskflow.app
          hdiutil detach /tmp/df
          out/Deskflow.app/Contents/MacOS/deskflow-core --version
          cp deskflow/LICENSE out/Deskflow-LICENSE.txt
          printf 'Deskflow %s, GPL-2.0 (Deskflow-LICENSE.txt). Source code:\nhttps://github.com/deskflow/deskflow/tree/%s\n' \
            "$DESKFLOW_TAG" "$DESKFLOW_TAG" > out/Deskflow-SOURCE.txt
          tar -czf deskflow-mac.tgz -C out .        # a tarball keeps the app's symlinks and permissions
      - uses: actions/upload-artifact@v6
        with: {name: "deskflow-mac-${{ matrix.arch }}", path: deskflow-mac.tgz, retention-days: 7}

  deskflow-windows:
    name: Deskflow engine (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with: {repository: deskflow/deskflow, ref: "${{ env.DESKFLOW_TAG }}", path: deskflow}
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with: {arch: amd64, spectre: true}
      - uses: jurplel/install-qt-action@v4
        env: {AQT_CONFIG: "${{ github.workspace }}/deskflow/.github/actions/install-dependencies/aqt.ini"}
        with:
          version: "6.11.3"
          cache: true
          cache-key-prefix: "qt-win-x64"
          aqtsource: ${{ env.AQT_SOURCE }}
      - id: vcpkg
        uses: johnwason/vcpkg-action@v8
        with:
          pkgs: openssl
          triplet: x64-windows-release
          extra-args: --classic --host-triplet=x64-windows-release
          token: ${{ github.token }}
          revision: master
      - name: Build
        working-directory: deskflow
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSKIP_BUILD_TESTS=ON ${{ steps.vcpkg.outputs.vcpkg-cmake-config }}
          cmake --build build --config Release -j8
          # only the portable zip (the runner has WiX, which would also try Deskflow's .msi)
          cd build && cpack -G ZIP -C Release
      - name: Unpack the portable build
        shell: pwsh
        run: |
          $zip = Get-ChildItem deskflow/build/*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName unpacked
          $core = Get-ChildItem unpacked -Recurse -Filter deskflow-core.exe | Select-Object -First 1
          New-Item -ItemType Directory out | Out-Null
          Copy-Item "$($core.DirectoryName)\*" out -Recurse
          Remove-Item out\settings -Recurse -ErrorAction SilentlyContinue   # WinLink writes its own
          & out\deskflow-core.exe --version
          Copy-Item deskflow\LICENSE out\Deskflow-LICENSE.txt
          "Deskflow $env:DESKFLOW_TAG, GPL-2.0 (Deskflow-LICENSE.txt). Source code:`nhttps://github.com/deskflow/deskflow/tree/$env:DESKFLOW_TAG" | Set-Content out\Deskflow-SOURCE.txt
      - uses: actions/upload-artifact@v6
        with: {name: deskflow-windows-x64, path: out, retention-days: 7}

  # ---------------------------------------------------------------- WinLink
  windows:
    name: WinLink for Windows
    needs: [version, deskflow-windows]
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - uses: actions/setup-go@v6
        with: {go-version-file: helper/go.mod, cache-dependency-path: helper/go.sum}
      - uses: actions/download-artifact@v7
        with: {name: deskflow-windows-x64, path: deskflow-engine}
      - name: Tailscale helper
        shell: bash
        working-directory: helper
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=windows GOARCH=$arch go build -trimpath -ldflags "-s -w -H windowsgui" -o ../bin/linkts-windows-$arch.exe .
          done
      - name: Opus
        shell: bash
        run: sh packaging/build_opus.sh
      - name: Build WinLink.exe
        run: |
          python -m pip install --upgrade -r requirements-windows.txt pyinstaller
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name WinLink --icon assets\WinLink.ico --paths src --add-data "src\webui;webui" --collect-all webview --collect-all pythonnet --collect-all clr_loader --collect-submodules zeroconf --collect-submodules pystray --add-data "assets\WinLink.png;." --add-binary "bin\linkts-windows-amd64.exe;." --add-binary "bin\linkts-windows-arm64.exe;." --add-binary "bin\opus.dll;." --add-data "bin\opus-COPYING.txt;." src\link.py
          Copy-Item deskflow-engine dist\WinLink\deskflow -Recurse
      - name: Check it
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); import app, kvm, net, cli"
          if (-not (Test-Path dist\WinLink\deskflow\deskflow-core.exe)) { throw "the engine is missing" }
          if (-not (Get-ChildItem dist\WinLink -Recurse -Filter opus.dll)) { throw "libopus is missing" }
          python packaging\check_opus.py src
          if ($LASTEXITCODE) { throw "Opus check failed" }
          & dist\WinLink\deskflow\deskflow-core.exe --version
      # A phone next to this PC, with the real Deskflow: WinLink joins for it, and the mouse pushed off
      # the right edge reaches it. Reported, but it doesn't stop the release (runners' desktops vary).
      - name: Phone screen with the real Deskflow
        continue-on-error: true
        run: |
          $env:WINLINK_DESKFLOW = "$PWD\deskflow-engine\deskflow-core.exe"
          python mobile\tests\harness\desktop_phone.py "$env:RUNNER_TEMP\phone"
          if ($LASTEXITCODE) { throw "phone screen checks failed" }
      - name: Installer
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            if (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") { $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6" }
            else { choco install innosetup -y --no-progress; $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6" }
          }
          iscc /DAppVersion=${{ needs.version.outputs.version }} packaging\windows\winlink.iss
      - uses: actions/upload-artifact@v6
        with: {name: winlink-windows, path: release/WinLink-Setup.exe, retention-days: 14}

  mac:
    name: WinLink for Mac (${{ matrix.name }})
    needs: [version, deskflow-mac]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: AppleSilicon, arch: arm64, runner: macos-15}
          - {name: Intel, arch: x86_64, runner: macos-15-intel}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - uses: actions/setup-go@v6
        with: {go-version-file: helper/go.mod, cache-dependency-path: helper/go.sum}
      - uses: actions/download-artifact@v7
        with: {name: "deskflow-mac-${{ matrix.arch }}"}
      - name: Build WinLink.app
        run: |
          mkdir -p bin && tar -xzf deskflow-mac.tgz -C bin
          python3 -m venv .venv
          sh build_mac.sh                      # signed ad hoc; puts bin/Deskflow.app inside
      - name: Check it
        run: |
          WinLink.app/Contents/Library/Deskflow.app/Contents/MacOS/deskflow-core --version
          find WinLink.app -name libopus.0.dylib | grep . || { echo "libopus is missing"; exit 1; }
          .venv/bin/python packaging/check_opus.py src
          WINLINK_HEADLESS=1 LINK_HOME="$RUNNER_TEMP/home" perl -e 'alarm 60; exec @ARGV' WinLink.app/Contents/MacOS/WinLink help | head -5
          codesign --verify --deep WinLink.app
      - name: Disk image
        run: sh packaging/mac/make_dmg.sh WinLink.app "release/WinLink-mac-${{ matrix.name }}.dmg"
      - uses: actions/upload-artifact@v6
        with: {name: "winlink-mac-${{ matrix.name }}", path: release/*.dmg, retention-days: 14}

  linux:
    name: WinLink for Linux (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    env:
      WINLINK_VERSION: ${{ needs.version.outputs.version }}
      PKG_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: {go-version-file: helper/go.mod, cache-dependency-path: helper/go.sum}
      - uses: actions/setup-python@v6           # only to fetch the vendored libraries (the system's pip refuses)
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - name: Stage the files
        run: |
          mkdir -p stage/bin stage/vendor release
          (cd helper && CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../stage/bin/linkts-linux-${{ matrix.arch }} .)
          cp -R src stage/src
          rm -f stage/src/clip_mac.py stage/src/clip_win.py stage/src/notch_mac.py
          find stage -name __pycache__ -prune -exec rm -rf {} +
          # pure-Python libraries (the rest comes from the distribution: see packaging/linux/nfpm.yaml)
          SKIP_CYTHON=1 python -m pip install --quiet --no-compile --no-deps --target stage/vendor \
            --no-binary zeroconf pywebview proxy_tools bottle typing_extensions pystray six python-xlib \
            sounddevice zeroconf ifaddr async-timeout
          find stage/vendor -name "*.so" -print -delete     # must stay pure Python: any distro, any Python 3.10+
      - name: Packages
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          ~/go/bin/nfpm package -f packaging/linux/nfpm.yaml -p deb -t release/
          ~/go/bin/nfpm package -f packaging/linux/nfpm.yaml -p rpm -t release/
          ls -la release
      - name: Install the .deb and check it
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ./release/winlink_*.deb
          winlink --check || echo "(some checks fail here: no sound devices on a build machine)"
          WINLINK_HEADLESS=1 LINK_HOME="$RUNNER_TEMP/home" timeout 60 winlink help | head -5
          # no screen here: pystray (tray) needs one, so it's left out of this import check
          /usr/bin/python3 -c "import sys; sys.path[:0] = ['/usr/lib/winlink/src', '/usr/lib/winlink/vendor']; import webview, sounddevice, zeroconf, app, kvm, net"
          /usr/bin/python3 packaging/check_opus.py /usr/lib/winlink/src
      - uses: actions/upload-artifact@v6
        with: {name: "winlink-linux-${{ matrix.arch }}", path: "release/*", retention-days: 14}

  android:
    name: WinLink for Android
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      WINLINK_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: "24", cache: npm, cache-dependency-path: mobile/package-lock.json}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "17"}
      - uses: actions/setup-go@v6
        with: {go-version-file: helper/go.mod, cache-dependency-path: helper/go.sum}
      - name: Tailscale helper for phones
        run: sh helper/build_android.sh
      - name: Native project
        working-directory: mobile
        run: |
          npm ci
          # version name = WinLink's version; version code 2026.11.6 -> 2026110600 (always growing)
          node -e '
            const fs = require("fs"); const v = process.env.WINLINK_VERSION;
            const [y, m, d] = v.split(".").map(Number);
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.version = v;
            app.expo.android.versionCode = y * 1000000 + m * 10000 + d * 100;
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
            console.log(v, app.expo.android.versionCode);'
          npx expo prebuild -p android --clean
      # Two APKs from one build: Full first, then Basic (packaging/android/basic.py takes the
      # accessibility service out of the manifest; gradle rebuilds only what that changes)
      - name: Build WinLink Full
        working-directory: mobile/android
        run: |
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64
          mkdir -p "$RUNNER_TEMP/apk" && cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apk/full.apk"
      - name: Build WinLink Basic
        run: |
          python3 packaging/android/basic.py
          cd mobile/android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apk/basic.apk"
      - name: Check them
        run: |
          aapt=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt
          "$aapt" dump xmltree "$RUNNER_TEMP/apk/full.apk" AndroidManifest.xml | grep -q RemoteInputService \
            || { echo "::error::WinLink Full has no mouse-and-keyboard service"; exit 1; }
          if "$aapt" dump xmltree "$RUNNER_TEMP/apk/basic.apk" AndroidManifest.xml | grep -q "RemoteInputService\|BIND_ACCESSIBILITY_SERVICE"; then
            echo "::error::WinLink Basic still has the accessibility service"; exit 1
          fi
          ls -la "$RUNNER_TEMP/apk"
      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No signing key in this repository's secrets (run packaging/android/make_signing_key.sh once): the APKs are built but not released."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/winlink.jks"
          signer=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          mkdir -p release
          # the same key and package for both, so either installs over the other (settings kept)
          for v in Basic Full; do
            low=$(echo $v | tr A-Z a-z)
            "$signer" sign --ks "$RUNNER_TEMP/winlink.jks" --ks-key-alias winlink --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEYSTORE_PASSWORD --out "release/WinLink-$v.apk" "$RUNNER_TEMP/apk/$low.apk"
            "$signer" verify --print-certs "release/WinLink-$v.apk" | head -3
          done
          rm -f "$RUNNER_TEMP/winlink.jks"
      - uses: actions/upload-artifact@v6
        with: {name: winlink-android, path: release/WinLink-*.apk, retention-days: 14, if-no-files-found: ignore}

  # ---------------------------------------------------------------- the release (tags only)
  release:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: [version, windows, mac, linux, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with: {pattern: "winlink-*", path: release, merge-multiple: true}
      - name: Draft it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la release
          notes=packaging/release-notes.md
          [ -f "$notes" ] || notes=/dev/null
          gh release create "$GITHUB_REF_NAME" --draft --title "WinLink ${{ needs.version.outputs.version }}" \
            --notes-file "$notes" release/*
