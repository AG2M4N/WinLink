name: Tests

# Desktop checks that need a system this Mac isn't: the Windows clipboard (copied files fetched only
# when pasted) and file copy-paste between two WinLink nodes on Linux.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "mobile/tests/harness/**", "mobile/vendor/**", ".github/workflows/tests.yml"]

jobs:
  windows-clipboard:
    name: Windows clipboard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: python mobile/tests/harness/win_clipboard.py

  clipboard-files:
    name: Copied files between computers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install cryptography zeroconf
      - run: python mobile/tests/harness/desktop_clipfiles.py "$RUNNER_TEMP/clip"

  phone-screen:
    name: A phone as a keyboard-and-mouse screen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install cryptography zeroconf
      # Deskflow's protocol against a stand-in server, then WinLink's sharing with a stand-in engine
      - run: python mobile/tests/harness/phone_screen.py
      - run: |
          printf '#!/bin/sh\nexec python "%s" "$@"\n' "$PWD/mobile/tests/harness/fake_deskflow_core.py" > "$RUNNER_TEMP/deskflow-core"
          chmod +x "$RUNNER_TEMP/deskflow-core"
          WINLINK_FAKE_CORE=1 WINLINK_DESKFLOW="$RUNNER_TEMP/deskflow-core" python mobile/tests/harness/desktop_phone.py "$RUNNER_TEMP/phone"

  linux-trackpad:
    name: Phone trackpad on Linux (virtual mouse)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo modprobe uinput || sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe uinput
      - run: sudo python3 mobile/tests/harness/linux_trackpad.py
      - run: python3 -c "import sys; sys.path.insert(0, 'src'); import check_linux, pointer"

  phone-socket-threads:
    name: Phone app sockets don't leak threads
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "17"}
      - run: |
          javac -d out mobile/vendor/react-native-tcp-socket/android/src/main/java/com/asterinet/react/tcpsocket/Threads.java mobile/tests/harness/TcpThreadsTest.java
          java -cp out com.asterinet.react.tcpsocket.TcpThreadsTest
